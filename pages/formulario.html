<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!--Paginas de Estilos-->
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/formulario.css">

    <!--Tipografias-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Julius+Sans+One&display=swap" rel="stylesheet">

<body>
        <!--Barra de menu-->
    <nav>
        <h3 id="mikuchina">MikuChina</h3>
        <ul>
        <a href="/pages/sobremi.html" class="menus"><li>SOBRE MI</li></a>
        <a href="/index.html" class="menus"><li>INICIO</li></a>

        </ul>
    </nav>


    <!--Formulario -->
    
   <div class="formulario-receta">

    <h2>Compartime tu Receta</h2>

    <form action="/enviar-receta" method="POST">
        <div class="campo">
            <label for="nombre">Tu Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="" required>
        </div>

        <div class="campo">
            <label for="receta">Nombre de la Receta:</label>
            <input type="text" id="receta" name="receta" placeholder="" required>
        </div>

        <div class="campo">
            <label for="descripcion">Preparación / Ingredientes:</label>
            <textarea id="descripcion" name="descripcion" rows="5" placeholder="Escribí tu receta..." required></textarea>
        </div>

        <button type="submit">Enviar Receta</button>
    </form>
</div>

    <!--Boton para volver a inicio-->

        <div class="voler">
        <a href="/index.html"><h6 class="inicio">INICIO</h6></a>
        </div>

     <footer>
        <div class="titulo-footer">
        <h6>Seguinos en las redes</h6>
        </div>
        <a href="https://www.instagram.com/" target="_blank"><img src="/img/footer/instagram.png" class="instagram"></a>
        <a href="https://www.whatsapp.com/" target="_blank"><img src="/img/footer/whatsapp.png" class="instagram"></a>
     </footer>

</body>
