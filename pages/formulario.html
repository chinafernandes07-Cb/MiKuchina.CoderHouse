<body>
        <!--Barra de menu-->
    <nav>
        <h3 id="mikuchina">MikuChina</h3>
        <ul>
        <a href="../pages/sobremi.html" class="menus"><li>SOBRE MI</li></a>

    <!--Formulario -->
    <div class="formulario">
    <div>
        <img src="../img/sobremi/mifoto.jpg" alt="mi foto">
    </div>


    <div class="formulario-receta">
       <h2>Compartime tu Receta</h2>

    <form action="../enviar-receta" method="POST">
        <div class="campo">
            <label for="nombre">Tu Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="" required>
        </div>

        <div class="campo">
            <label for="receta">Nombre de la Receta:</label>
            <input type="text" id="receta" name="receta" placeholder="" required>
        </div>

        <div class="campo">
            <label for="descripcion">Preparación / Ingredientes:</label>
            <textarea id="descripcion" name="descripcion" rows="5" placeholder="Escribí tu receta..." required></textarea>
        </div>

        <button type="submit">Enviar Receta</button>
           

    </form>

    </div>
    </div>

  
     <footer>
        <div class="redes">
        <h6>SEGUIME EN TUS REDES</h6>
        </div>
        <div>
        <a href="https://www.instagram.com/" target="_blank"><img src="../img/footer/instagram.png" class="instagram"></a>
        <a href="https://www.whatsapp.com/" target="_blank"><img src="../img/footer/whatsapp.png" class="whatsapp"></a>
        </div>
     </footer>
